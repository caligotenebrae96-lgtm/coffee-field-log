<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coffee Field Log ver0.5</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#f4f4f2;color:#222;font-family:system-ui,sans-serif}.app{max-width:600px;margin:auto}h1{margin-bottom:4px;font-size:24px}.subtitle{margin-top:0;color:#666;font-size:14px}.card{background:white;padding:16px;margin:16px 0;border-radius:12px}label{display:block;margin-top:14px;margin-bottom:5px;font-weight:600}input,select,textarea{width:100%;padding:11px;border:1px solid #bbb;border-radius:8px;font-size:16px;background:white}input[type=range]{padding:6px 0}textarea{min-height:80px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:#222;color:white;font-size:16px;font-weight:700;cursor:pointer}.record{border-top:1px solid #ddd;padding:14px 0}.record:first-child{border-top:none}.score{font-weight:700}.taste,.visit-info,.record-id{color:#555;font-size:14px}.record-id{color:#999;font-size:12px}.button-row{display:flex;gap:8px;margin-top:8px}.button-row button{width:auto;margin-top:0;padding:7px 12px;font-size:13px}.delete,.cancel{background:#ddd;color:#333}#editNotice{display:none;padding:10px;margin-bottom:10px;background:#eee;border-radius:8px;font-size:14px}.backup-note,.hint{color:#666;font-size:13px;line-height:1.5}.backup-button{margin-top:10px}.restore-button{background:#555}.hidden-file{display:none}.missing{color:#888}
</style></head><body>
<div class="app"><h1>☕ Coffee Field Log</h1><p class="subtitle">コーヒー・フィールドワーク記録 Ver. 0.5</p>
<div class="card"><div id="editNotice">記録を編集中</div>
<label for="shop">店名・商品名</label><input id="shop" placeholder="例：ドトール 国分寺店／自宅 トップバリュ">
<label for="date">日付</label><input id="date" type="date"><label for="time">入店時間・試飲時間</label><input id="time" type="time">
<label for="crowding">混雑度</label><select id="crowding"><option>かなり空いている</option><option>やや空いている</option><option selected>普通</option><option>混雑</option><option>大混雑</option><option value="該当なし">該当なし（自宅など）</option></select>
<label for="rating">好み</label><select id="rating"><option value="5">5 / 5　かなり好き</option><option value="4">4 / 5　好き</option><option value="3" selected>3 / 5　まあまあ</option><option value="2">2 / 5　あまり好みでない</option><option value="1">1 / 5　好みでない</option></select>
<label for="bitter">苦味の強さ：<span id="bitterValue">3</span> / 5</label><input id="bitter" type="range" min="1" max="5" value="3">
<label for="acid">酸味：<span id="acidValue">3</span> / 5</label><input id="acid" type="range" min="1" max="5" value="3">
<label for="bodyTaste">コク：<span id="bodyValue">3</span> / 5</label><input id="bodyTaste" type="range" min="1" max="5" value="3">
<label for="bitterQuality">苦味の心地よさ（新規）</label><select id="bitterQuality"><option value="" selected>未評価・わからない</option><option value="1">1 / 5　不快</option><option value="2">2 / 5　やや不快</option><option value="3">3 / 5　普通</option><option value="4">4 / 5　心地よい</option><option value="5">5 / 5　とても心地よい</option></select><p class="hint">苦味の強弱とは別に評価する。苦味が弱く判断できない場合は「未評価」でよい。</p>
<label for="aftertaste">後味（新規）</label><select id="aftertaste"><option value="" selected>未評価・わからない</option><option value="すっきり消える">すっきり消える</option><option value="心地よく残る">心地よく残る</option><option value="不快に残る">不快に残る</option><option value="その他">その他（メモに記入）</option></select>
<label for="other">その他</label><textarea id="other" placeholder="香り、温度、10分後の変化、気になったことなど"></textarea>
<button id="saveButton" type="button" onclick="saveCoffee()">記録する</button><button id="cancelButton" class="cancel" type="button" onclick="cancelEdit()" style="display:none">編集をキャンセル</button></div>
<div class="card"><h2>記録 <span id="count"></span></h2><div id="records"></div></div>
<div class="card"><h2>データ管理</h2><p class="backup-note">CSVは表計算・分析用。JSONは全記録のバックアップ・復元用。読み込みは現在の記録を置き換えるため、事前にJSONバックアップを保存することを推奨。</p>
<button class="backup-button" type="button" onclick="exportCSV()">CSVを書き出す</button><button class="backup-button" type="button" onclick="exportJSON()">JSONバックアップを書き出す</button>
<button class="backup-button restore-button" type="button" onclick="document.getElementById('jsonFile').click()">JSONバックアップから復元</button><input class="hidden-file" id="jsonFile" type="file" accept=".json,application/json" onchange="importFile(event,'json')">
<button class="backup-button restore-button" type="button" onclick="document.getElementById('csvFile').click()">CSVから読み込む（ver0.4／0.5）</button><input class="hidden-file" id="csvFile" type="file" accept=".csv,text/csv" onchange="importFile(event,'csv')"></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const sliders=[['bitter','bitterValue'],['acid','acidValue'],['bodyTaste','bodyValue']];
sliders.forEach(([id,label])=>$(id).addEventListener('input',()=>$(label).textContent=$(id).value));
function createId(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}
let coffees=[];
try{const saved=JSON.parse(localStorage.getItem('coffeeLog')||'[]');if(Array.isArray(saved))coffees=saved.filter(c=>c&&typeof c==='object'&&typeof c.shop==='string')}catch(e){alert('保存データを読み取れなかった。バックアップを確認してほしい。')}
let changed=false;coffees.forEach(c=>{if(!c.id){c.id=createId();changed=true}});if(changed)saveToStorage();
let editingId=null;
function saveToStorage(){try{localStorage.setItem('coffeeLog',JSON.stringify(coffees));return true}catch(e){alert('ブラウザへの保存に失敗した。ストレージ容量や設定を確認してほしい。');return false}}
function updateSliderLabels(){sliders.forEach(([id,label])=>$(label).textContent=$(id).value)}
function resetForm(){editingId=null;$('shop').value='';const d=new Date();$('date').value=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');$('time').value='';$('crowding').value='普通';$('rating').value='3';['bitter','acid','bodyTaste'].forEach(id=>$(id).value='3');$('bitterQuality').value='';$('aftertaste').value='';$('other').value='';updateSliderLabels();$('saveButton').textContent='記録する';$('cancelButton').style.display='none';$('editNotice').style.display='none'}
function saveCoffee(){const shop=$('shop').value.trim();if(!shop){alert('店名を入力してくれたまえ。');return}const item={shop,date:$('date').value,time:$('time').value,crowding:$('crowding').value,rating:Number($('rating').value),bitter:Number($('bitter').value),acid:Number($('acid').value),body:Number($('bodyTaste').value),bitterQuality:$('bitterQuality').value===''?null:Number($('bitterQuality').value),aftertaste:$('aftertaste').value,other:$('other').value.trim()};const previous=coffees.slice();if(editingId===null){item.id=createId();coffees.unshift(item)}else{const i=coffees.findIndex(c=>c.id===editingId);if(i<0){alert('編集対象が見つからなかった。');return}item.id=editingId;coffees[i]={...coffees[i],...item}}if(!saveToStorage()){coffees=previous;return}resetForm();render()}
function editCoffee(id){const c=coffees.find(c=>c.id===id);if(!c)return;editingId=id;['shop','date','time'].forEach(k=>$(k).value=c[k]||'');$('crowding').value=c.crowding||'普通';$('rating').value=c.rating??3;$('bitter').value=c.bitter??3;$('acid').value=c.acid??3;$('bodyTaste').value=c.body??3;$('bitterQuality').value=c.bitterQuality??'';$('aftertaste').value=c.aftertaste||'';$('other').value=c.other||c.memo||'';updateSliderLabels();$('saveButton').textContent='更新する';$('cancelButton').style.display='block';$('editNotice').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
function cancelEdit(){resetForm()}
function deleteCoffee(id){if(!confirm('この記録を削除するかい？'))return;const old=coffees;coffees=coffees.filter(c=>c.id!==id);if(!saveToStorage()){coffees=old;return}if(editingId===id)resetForm();render()}
function escapeHtml(text){const div=document.createElement('div');div.textContent=String(text??'');return div.innerHTML}
function displayNum(n){return n===null||n===undefined||n===''?'未評価':String(n)+'/5'}
function render(){$('count').textContent=`（${coffees.length}件）`;const area=$('records');if(!coffees.length){area.innerHTML='<p>まだ記録がない。</p>';return}area.innerHTML=coffees.map(c=>{const visit=[c.time?'入店・試飲 '+c.time:'',c.crowding?'混雑度：'+c.crowding:''].filter(Boolean).join('　');const note=c.other||c.memo||'';const rating=Math.max(0,Math.min(5,Number(c.rating)||0));return `<div class="record"><strong>${escapeHtml(c.shop)}</strong><br><small>${escapeHtml(c.date||'')}</small><div class="record-id">ID: ${escapeHtml(c.id)}</div>${visit?`<p class="visit-info">${escapeHtml(visit)}</p>`:''}<p class="score">好み：${'★'.repeat(rating)}${'☆'.repeat(5-rating)}</p><p class="taste">苦味 ${escapeHtml(displayNum(c.bitter))}　酸味 ${escapeHtml(displayNum(c.acid))}　コク ${escapeHtml(displayNum(c.body))}</p><p class="taste">苦味の心地よさ：${escapeHtml(displayNum(c.bitterQuality))}<br>後味：${escapeHtml(c.aftertaste||'未評価')}</p>${note?`<p>${escapeHtml(note)}</p>`:''}<div class="button-row"><button type="button" class="edit" data-action="edit" data-id="${escapeHtml(c.id)}">編集</button><button type="button" class="delete" data-action="delete" data-id="${escapeHtml(c.id)}">削除</button></div></div>`}).join('')}
$('records').addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const id=btn.dataset.id;if(btn.dataset.action==='edit')editCoffee(id);else deleteCoffee(id)});
const headers=['ID','店名','日付','入店時間','混雑度','好み','苦味','酸味','コク','その他','苦味の心地よさ','後味'];
function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(){if(!coffees.length){alert('書き出すデータがないよ。');return}const rows=coffees.map(c=>[c.id||'',c.shop||'',c.date||'',c.time||'',c.crowding||'',c.rating??'',c.bitter??'',c.acid??'',c.body??'',c.other||c.memo||'',c.bitterQuality??'',c.aftertaste||'']);const csv=[headers,...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');downloadBlob(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}),makeFileName('coffee-field-log-v0.5','csv'))}
function exportJSON(){if(!coffees.length){alert('書き出すデータがないよ。');return}downloadBlob(new Blob([JSON.stringify(coffees,null,2)],{type:'application/json;charset=utf-8'}),makeFileName('coffee-field-log-backup','json'))}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function makeFileName(base,ext){const d=new Date();return `${base}-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.${ext}`}
function parseCSV(s){s=s.replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<s.length;i++){const ch=s[i];if(quoted){if(ch==='"'&&s[i+1]==='"'){cell+='"';i++}else if(ch==='"'){quoted=false}else{cell+=ch}}else if(ch==='"'){if(cell!=='')throw Error('CSVの引用符が不正');quoted=true}else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else{cell+=ch}}if(quoted)throw Error('CSVの引用符が閉じていない');row.push(cell);if(row.some(v=>v!==''))rows.push(row);return rows}
function csvToRecords(text){const rows=parseCSV(text);if(rows.length<2)throw Error('CSVに記録がない');const h=rows.shift().map(x=>x.trim());if(!h.includes('店名')||!h.includes('好み'))throw Error('CSVの列名が違う');const col=(r,name)=>{const i=h.indexOf(name);return i<0?'':(r[i]??'')};const number=(v)=>v===''?null:Number(v);return rows.map(r=>({id:col(r,'ID'),shop:col(r,'店名'),date:col(r,'日付'),time:col(r,'入店時間'),crowding:col(r,'混雑度'),rating:number(col(r,'好み')),bitter:number(col(r,'苦味')),acid:number(col(r,'酸味')),body:number(col(r,'コク')),other:col(r,'その他'),bitterQuality:number(col(r,'苦味の心地よさ')),aftertaste:col(r,'後味')}))}
function validateRecords(data){if(!Array.isArray(data))throw Error('記録の配列ではない');if(!data.every(c=>c&&typeof c==='object'&&!Array.isArray(c)&&typeof c.shop==='string'&&c.shop.trim()))throw Error('記録の形式が違う');const ids=new Set();return data.map(c=>{const item={...c};if(typeof item.id!=='string'||!item.id||ids.has(item.id))item.id=createId();ids.add(item.id);if(item.bitterQuality===undefined||item.bitterQuality==='')item.bitterQuality=null;if(item.aftertaste===undefined)item.aftertaste='';return item})}
async function importFile(event,type){const file=event.target.files?.[0];if(!file)return;try{const text=await file.text();const imported=validateRecords(type==='json'?JSON.parse(text):csvToRecords(text));if(!confirm(`現在の${coffees.length}件を、読み込んだ${imported.length}件で置き換えるよ。事前にバックアップを保存したかい？`))return;const old=coffees;coffees=imported;if(!saveToStorage()){coffees=old;return}resetForm();render();alert(`${imported.length}件を読み込んだよ。`)}catch(e){alert('ファイルを読み込めなかった：'+e.message)}finally{event.target.value=''}}
resetForm();render();
</script></body></html>
